<!doctype html>
<html lang="en">
<head>
<script>window.OVERRIDE_STATIC = true;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation Revision Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efede7; --panel: #f7f6f2; --card: rgba(255,255,255,.62); --card-solid: #fbfaf7;
    --ink: #1c1c1a; --ink-2: #4a4945; --muted: #8a8880; --line: #e3e0d7; --line-2: #d6d2c6;
    --cue: #fbe6a2; --cue-b: #f1cd62; --cue-i: #6b4f00; --cue-c: #f2c443;
    --val: #cdeed6; --val-b: #8ed3a4; --val-i: #1d5a31; --val-c: #3cb56a;
    --ref: #d9e7fb; --ref-b: #9dc0f1; --ref-i: #1d4f8f; --ref-c: #4f8fe6;
    --old: #e7e0fa; --old-b: #b8a6ee; --old-i: #4b3a8c; --old-c: #9b7fe6;
    --none: #f1efe9; --none-c: #b9b6ad;
    --aside: #f1f0eb; --surface: #ffffff; --turn: rgba(240,238,232,.75); --dark: #2b2b28; --dark-ink: #ffffff; --switch: #3a3a37;
    --head: rgba(232,229,221,.6); --track: #e6e3dc; --chip: rgba(255,255,255,.55); --who-u: #dbe8fb; --who-s: #d6efdd;
    --mini: #b8b5ac; --seed: #8f8c84; --hist-hi: #2a2a28; --glow1: rgba(255,255,255,.7); --glow2: rgba(255,255,255,.45);
    --hover: rgba(0,0,0,.04); --err: #a33; --art: none;
    --serif: "EB Garamond", Garamond, Georgia, serif;
    --sans: Inter, "Segoe UI", system-ui, sans-serif;
    --r: 12px;
  }
  :root[data-theme=dark] {
    --paper: #141412; --panel: #1b1a18; --card: rgba(255,255,255,.035); --card-solid: #1d1c19;
    --ink: #ece8df; --ink-2: #bdb8ad; --muted: #8a867c; --line: #2c2a26; --line-2: #3b3934;
    --cue: #3b3115; --cue-b: #9f7e2a; --cue-i: #f3d27a; --cue-c: #e2b23c;
    --val: #13311e; --val-b: #3a8b58; --val-i: #9fe0b5; --val-c: #45bf74;
    --ref: #152943; --ref-b: #4573b2; --ref-i: #a9c8f3; --ref-c: #5d9bef;
    --old: #261f3e; --old-b: #765fc0; --old-i: #cbbcf5; --old-c: #a68cf0;
    --none: #22211e; --none-c: #5c5951;
    --aside: #181715; --surface: #191816; --turn: rgba(255,255,255,.035); --dark: #ece8df; --dark-ink: #171614; --switch: #4a4842;
    --head: rgba(255,255,255,.04); --track: #2c2a26; --chip: rgba(255,255,255,.04); --who-u: #1b2c46; --who-s: #163422;
    --mini: #5c5951; --seed: #8a867c; --hist-hi: #ece8df; --glow1: rgba(255,255,255,.035); --glow2: rgba(255,255,255,.02);
    --hover: rgba(255,255,255,.05); --err: #f08a80; color-scheme: dark;
  }
  body, .card, .pill, aside, .turn, textarea, .chip, .rc, .span-card, .ex, .seg { transition: background-color .35s, border-color .35s, color .35s; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px;
         background-image: radial-gradient(ellipse at 70% 10%, var(--glow1), transparent 60%),
                           radial-gradient(ellipse at 20% 90%, var(--glow2), transparent 55%); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 196px minmax(0, 1fr); min-height: 100vh; }

  /* sidebar */
  aside { background: var(--aside); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .brand { font-family: var(--serif); font-weight: 600; letter-spacing: 1.4px; font-size: 15px; line-height: 1.35; padding: 30px 26px 0; text-transform: uppercase; }
  .brand + hr { width: 28px; margin: 22px 26px 26px; border: 0; border-top: 1px solid var(--ink-2); }
  nav { display: flex; flex-direction: column; gap: 6px; padding: 0 14px; }
  nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 11px 14px; border-radius: 8px; font-family: var(--serif); font-size: 17px; color: var(--ink-2); text-align: left; }
  nav button svg { width: 19px; height: 19px; flex: none; }
  nav button:hover { background: var(--hover); }
  nav button.on { background: var(--dark); color: var(--dark-ink); }
  .tagline { margin: 26px 24px 0; font-family: var(--serif); font-size: 15px; line-height: 1.3; color: var(--ink-2); }
  .side-art { flex: 1; min-height: 150px; margin-top: 12px; position: relative; }
  .side-art::after { content: ""; position: absolute; inset: 0; background: url(static/sidebar.jpg) center bottom / cover no-repeat; transition: filter .35s; }
  .side-art::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(var(--aside) 0%, transparent 45%); }
  :root[data-theme=dark] .side-art::after { filter: invert(.88) hue-rotate(180deg) brightness(.75) contrast(1.05) sepia(.15); }
  .tagline b { color: var(--ink); font-weight: 500; }
  .tagline::after { content: ""; display: block; width: 24px; border-top: 1px solid var(--ink-2); margin-top: 12px; }

  /* top status */
  main { min-width: 0; padding: 18px 26px 28px; }
  .topbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 14px; }
  .pill { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; }
  .pill svg { width: 20px; height: 20px; color: var(--ink-2); }
  .pill b { display: block; font-size: 12.5px; font-weight: 600; } .pill small { display: block; font-size: 11px; color: var(--muted); }
  .view { display: none; } .view.on { display: block; }
  .themebtn { padding: 7px 12px; } .themebtn:hover { border-color: var(--line-2); }
  .themebtn .sun { display: none; } :root[data-theme=dark] .themebtn .sun { display: block; } :root[data-theme=dark] .themebtn .moon { display: none; }

  /* examples page */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat { background: var(--card-solid); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .stat small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .stat b { font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1; }
  .stat .dots { display: flex; gap: 6px; margin-top: 8px; } .stat .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .runall { width: 100%; height: 100%; border: 0; border-radius: 10px; background: var(--dark); color: var(--dark-ink); font-family: var(--serif); font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .runall:disabled { opacity: .7; cursor: progress; }
  .extable td { vertical-align: top; padding: 14px 12px; } .extable tbody tr { opacity: 1; }
  .extable tbody tr:hover { background: var(--hover); }
  .extable .scn b { display: block; font-family: var(--serif); font-size: 17px; font-weight: 600; } .extable .scn small { color: var(--muted); font-size: 12px; }
  .dom { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); background: var(--turn); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .ctx { color: var(--muted); font-size: 12.5px; line-height: 1.45; max-width: 260px; } .ctx span { color: var(--ink-2); }
  .msg { font-family: var(--serif); font-size: 18px; line-height: 1.55; }
  .msg mark { color: inherit; border-radius: 4px; padding: 0 3px; }
  .msg mark.g-cue { background: var(--cue); } .msg mark.g-val { background: var(--val); } .msg mark.g-ref { background: var(--ref); } .msg mark.g-old { background: var(--old); }
  .found-roles { display: flex; flex-wrap: wrap; gap: 5px; max-width: 250px; } .pending { color: var(--muted); font-size: 12.5px; }
  .open { border: 1px solid var(--line-2); background: var(--card-solid); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; white-space: nowrap; }
  .open:hover { border-color: var(--ink-2); }

  /* cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; backdrop-filter: blur(2px); }
  .head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .head > div:nth-child(2) { flex: 1 1 220px; min-width: 0; }
  .num { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-family: var(--serif); font-size: 19px; color: var(--ink-2); background: var(--card-solid); }
  .head h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 25px; letter-spacing: -.2px; }
  .head p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; background: var(--card-solid); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button { white-space: nowrap; border: 0; background: none; padding: 8px 22px; border-radius: 6px; font-size: 13px; color: var(--ink-2); }
  .seg button.on { background: var(--dark); color: var(--dark-ink); }
  .ghost { border: 0; background: none; color: var(--ink-2); font-size: 12.5px; display: flex; align-items: center; gap: 6px; padding: 4px 6px; }
  .ghost:hover { color: var(--ink); }

  /* analyze layout */
  .an { display: grid; grid-template-columns: 430px minmax(0, 1fr); gap: 18px; align-items: start; }
  .an.wide { grid-template-columns: minmax(0, 1fr); }
  .an.wide .leftcol { display: none; }
  .leftcol { display: flex; flex-direction: column; gap: 16px; }
  .turn { display: flex; align-items: center; gap: 12px; background: var(--turn); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; }
  .who { flex: none; border: 0; border-radius: 6px; font-size: 12px; font-weight: 600; letter-spacing: .4px; padding: 6px 12px; }
  .who.USER { background: var(--who-u); color: var(--ref-i); } .who.SYSTEM { background: var(--who-s); color: var(--val-i); }
  .turn input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 14px; color: var(--ink); outline: none; }
  .turn .t { color: var(--muted); font-size: 12px; }
  .turn .x { border: 0; background: none; color: var(--muted); font-size: 17px; padding: 0 2px; opacity: 0; }
  .turn:hover .x { opacity: 1; }
  .btn { border: 1px solid var(--line-2); background: var(--card-solid); border-radius: 8px; padding: 9px 16px; display: inline-flex; gap: 8px; align-items: center; }
  .btn:hover { background: var(--surface); }
  textarea { width: 100%; min-height: 108px; resize: vertical; border: 1px solid var(--line-2); border-radius: 10px; padding: 14px 16px; font: 17px/1.5 var(--sans); color: var(--ink); background: var(--surface); outline: none; }
  textarea:focus { border-color: #c9b066; box-shadow: 0 0 0 3px rgba(242,196,67,.25); }
  .count { margin-left: auto; color: var(--muted); font-size: 12.5px; }
  .toggle { display: flex; gap: 14px; align-items: flex-start; margin: 4px 2px 0; }
  .switch { flex: none; width: 46px; height: 26px; border-radius: 13px; background: var(--switch); position: relative; border: 0; transition: background .2s; }
  .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
  .switch[aria-checked=true] { background: var(--val-c); } .switch[aria-checked=true]::after { left: 23px; }
  .switch:disabled { opacity: .4; cursor: not-allowed; }
  .toggle b { font-weight: 600; } .toggle small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .go { width: 100%; border: 0; border-radius: 10px; background: var(--dark); color: var(--dark-ink); padding: 17px 20px; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--serif); font-size: 19px; position: relative; }
  .go:hover { opacity: .9; } .go:disabled { opacity: .7; cursor: progress; }
  .go kbd { position: absolute; right: 18px; font: 12px var(--sans); color: var(--muted); }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .ex-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ex { text-align: left; border: 1px solid var(--line); background: var(--card-solid); border-radius: 10px; padding: 12px; }
  .ex:hover { border-color: var(--ref-b); }
  .ex b { display: block; font-weight: 600; margin-bottom: 5px; } .ex span { color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
  .sub { display: flex; align-items: baseline; margin-bottom: 10px; } .sub h3 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 19px; }

  /* model understanding (visual) */
  .stage { position: relative; min-height: 430px; }
  .stage svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .tags-row, .chips-row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .tags-row { height: 50px; position: relative; }
  .chips-row { margin-top: 64px; flex-wrap: nowrap; }
  .chip { white-space: nowrap; font-family: var(--serif); font-size: 44px; line-height: 1; padding: 14px 18px 16px; border-radius: 10px; background: var(--chip); border: 1px solid var(--line); color: var(--ink-2);
          opacity: 0; transform: translateY(-10px); transition: opacity .3s, transform .3s, background .5s, border-color .5s, color .5s; }
  .chip.in { opacity: 1; transform: none; }
  .chips-row.wrap { flex-wrap: wrap; row-gap: 34px !important; margin-top: 10px; }
  .chips-row.wrap .chip.lit { position: relative; }
  .chips-row.wrap .chip.lit::after { content: attr(data-label); position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); font: 600 9.5px var(--sans); letter-spacing: .3px; color: var(--ink-2); white-space: nowrap; }
  .stage.compact .tags-row { display: none; }
  .chip.punct { padding: 14px 12px 16px; }
  .chip.c-UPDATE_CUE.lit, .chip.c-CANCEL_CUE.lit, .chip.c-KEEP_CUE.lit, .chip.c-RESTORE_CUE.lit { background: var(--cue); border-color: var(--cue-b); color: var(--ink); }
  .chip.c-NEW_VALUE.lit { background: var(--val); border-color: var(--val-b); color: var(--ink); }
  .chip.c-REFERENCE.lit { background: var(--ref); border-color: var(--ref-b); color: var(--ink); }
  .chip.c-OLD_VALUE.lit, .chip.c-KEPT_VALUE.lit { background: var(--old); border-color: var(--old-b); color: var(--ink); }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .3px; border-radius: 5px; padding: 4px 8px; border: 1px solid transparent; white-space: nowrap; }
  .b-UPDATE_CUE, .b-CANCEL_CUE, .b-KEEP_CUE, .b-RESTORE_CUE { background: var(--cue); border-color: var(--cue-b); color: var(--cue-i); }
  .b-NEW_VALUE { background: var(--val); border-color: var(--val-b); color: var(--val-i); }
  .b-REFERENCE { background: var(--ref); border-color: var(--ref-b); color: var(--ref-i); }
  .b-OLD_VALUE, .b-KEPT_VALUE { background: var(--old); border-color: var(--old-b); color: var(--old-i); }
  .b-O { background: transparent; color: var(--ink-2); font-weight: 400; }
  .tag-float { position: absolute; transform: translate(-50%, 0); opacity: 0; transition: opacity .35s; }
  .tag-float.in { opacity: 1; }
  .cards-row { display: flex; justify-content: center; gap: 26px; margin-top: 74px; flex-wrap: wrap; }
  .rc { min-width: 196px; display: flex; gap: 14px; align-items: center; background: var(--card-solid); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px;
        opacity: 0; transform: translateY(10px); transition: opacity .35s, transform .35s; }
  .rc.in { opacity: 1; transform: none; }
  .rc svg { width: 26px; height: 26px; flex: none; color: var(--ink-2); }
  .rc small { display: block; color: var(--muted); font-size: 12.5px; } .rc b { font-family: var(--serif); font-size: 19px; font-weight: 600; }
  .link-path { fill: none; stroke-width: 1.6; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); transition: stroke-dashoffset .7s ease-out; }
  .link-path.in { stroke-dashoffset: 0; }
  .legend { display: flex; justify-content: center; gap: 38px; margin-top: 34px; color: var(--ink-2); font-size: 13px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--c); margin-right: 8px; vertical-align: -1px; }
  .placeholder { color: var(--muted); text-align: center; padding: 120px 20px; font-family: var(--serif); font-size: 20px; }
  .verdict { text-align: center; margin-top: 30px; font-family: var(--serif); font-size: 20px; color: var(--ink-2); }

  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; color: var(--ink-2); background: var(--head); padding: 10px 12px; border-bottom: 1px solid var(--line-2); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  tbody tr { opacity: 0; transition: opacity .25s; } tbody tr.in { opacity: 1; }
  td.mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; color: var(--ink-2); }
  td .badge { min-width: 112px; }
  .bar { height: 9px; background: var(--track); border-radius: 5px; overflow: hidden; width: 100%; min-width: 90px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 5px; transition: width .6s ease-out; background: var(--none-c); }
  .f-UPDATE_CUE, .f-CANCEL_CUE, .f-KEEP_CUE, .f-RESTORE_CUE { background: var(--cue-c) !important; }
  .f-NEW_VALUE { background: var(--val-c) !important; } .f-REFERENCE { background: var(--ref-c) !important; }
  .f-OLD_VALUE, .f-KEPT_VALUE { background: var(--old-c) !important; }
  .confcell { display: flex; align-items: center; gap: 12px; } .confcell span { width: 34px; text-align: right; }

  /* spans */
  .spans-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  .span-card { display: flex; align-items: center; gap: 16px; border: 1px solid var(--line); border-left: 4px solid var(--c); background: var(--card-solid); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; width: 100%; text-align: left;
               opacity: 0; transform: translateX(-8px); transition: opacity .3s, transform .3s, box-shadow .2s; }
  .span-card.in { opacity: 1; transform: none; }
  .span-card.sel { box-shadow: 0 0 0 2px var(--c) inset; }
  .span-card q { font-family: var(--serif); font-size: 21px; quotes: "\201C" "\201D"; }
  .span-card .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .span-card .pct { font-weight: 600; font-size: 15px; margin-left: auto; }
  .minibars { display: flex; align-items: flex-end; gap: 4px; height: 30px; }
  .minibars i { width: 7px; background: var(--mini); border-radius: 2px; }
  .detail dl { display: grid; grid-template-columns: 110px 1fr; gap: 14px 10px; margin: 0; font-size: 14px; } .detail dt { color: var(--muted); }
  .seedbars { display: flex; gap: 26px; align-items: flex-end; height: 120px; margin: 18px 0 6px; padding-left: 110px; }
  .seedbars div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .seedbars i { width: 26px; background: var(--seed); border-radius: 3px 3px 0 0; height: 0; transition: height .6s ease-out; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; justify-content: center; margin-top: 8px; }
  .strip .w { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .strip .w b { font-family: var(--serif); font-size: 22px; font-weight: 500; padding: 6px 12px; border-radius: 7px; border-bottom: 3px solid transparent; }
  .strip .w small { font-size: 10.5px; color: var(--muted); letter-spacing: .3px; min-height: 13px; }

  /* model info, charts */
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  .chart { display: flex; align-items: flex-end; gap: 22px; height: 170px; padding: 10px 6px 0; border-bottom: 1px solid var(--line-2); }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; font-size: 12px; }
  .chart .col i { width: 100%; max-width: 54px; border-radius: 4px 4px 0 0; height: 0; transition: height .7s ease-out; background: var(--none-c); }
  .chart .col b { font-size: 12px; } .chart-labels { display: flex; gap: 22px; padding: 6px 6px 0; } .chart-labels span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
  .hist { display: flex; align-items: flex-end; gap: 4px; height: 140px; border-bottom: 1px solid var(--line-2); }
  .hist i { flex: 1; background: var(--mini); border-radius: 2px 2px 0 0; height: 0; transition: height .6s; } .hist i.hi { background: var(--hist-hi); }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding-top: 4px; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; font-size: 13px; } .kv small { color: var(--muted); display: block; margin-bottom: 4px; }
  .bench td:last-child, .bench th:last-child { text-align: right; } .bench tr.me td { font-weight: 600; }
  .about { max-width: 820px; font-size: 15px; line-height: 1.65; color: var(--ink-2); } .about h3 { font-family: var(--serif); font-size: 21px; color: var(--ink); margin: 22px 0 6px; }
  .ex-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .ex-grid .ex { padding: 18px; } .ex-grid .ex span { font-size: 14px; }
  #st-table, .extable-wrap { overflow-x: auto; }
  @media (max-width: 1400px) { .an { grid-template-columns: 380px minmax(0, 1fr); } .cards-row { gap: 12px; flex-wrap: nowrap; } .rc { min-width: 0; flex: 0 1 230px; padding: 12px 14px; } .rc b { font-size: 16px; } }
  @media (max-width: 1250px) { .stats { grid-template-columns: repeat(2, 1fr); } .extable .ctx { display: none; } .an { grid-template-columns: minmax(0, 1fr); } .spans-grid, .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .filters .seg { flex-wrap: wrap; max-width: 100%; } .app { grid-template-columns: 1fr; } aside { position: static; height: auto; } .side-art { display: none; } nav { flex-direction: row; flex-wrap: wrap; padding-bottom: 12px; }
    .chip { font-size: 28px; } .ex-row, .ex-grid { grid-template-columns: 1fr; } main { padding: 12px; } .card { padding: 18px 16px; } .topbar { flex-wrap: wrap; } }
  /* language switch */
  .lang { display: flex; padding: 3px; gap: 2px; }
  .lang button { border: 0; background: none; border-radius: 6px; padding: 6px 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .lang button.on { background: var(--dark); color: var(--dark-ink); }
  /* theme transition tiles */
  #tiles { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
  /* context note and guide */
  .ctxnote { margin: 4px 0 12px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); background: var(--turn); border: 1px dashed var(--line-2); border-radius: 8px; padding: 9px 12px; }
  .ctxnote.on { border-style: solid; border-color: var(--val-b); background: var(--val); color: var(--val-i); }
  .guide { max-width: 640px; margin: 40px auto 0; font-size: 15px; line-height: 1.6; color: var(--ink-2); }
  .guide h3 { font-family: var(--serif); font-size: 24px; color: var(--ink); margin: 0 0 14px; font-weight: 600; }
  .guide ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .guide li { counter-increment: s; position: relative; padding: 0 0 18px 50px; }
  .guide li::before { content: counter(s); position: absolute; left: 0; top: -2px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-family: var(--serif); font-size: 17px; color: var(--ink); background: var(--card-solid); }
  .guide b { color: var(--ink); }
  .guide p { margin: 8px 0 0 50px; color: var(--muted); font-size: 14px; }
  .g { border-radius: 4px; padding: 1px 6px; color: var(--ink); white-space: nowrap; }

  /* dataset page */
  .dchart { display: flex; flex-direction: column; gap: 9px; }
  .drow { display: grid; grid-template-columns: 118px minmax(0, 1fr) 60px; align-items: center; gap: 10px; font-size: 12.5px; }
  .drow .lbl { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--track); }
  .drow .stack i { display: block; height: 100%; width: 0; transition: width .7s ease-out; }
  .drow .n { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .keys { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
  .keys span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .filters input[type=search] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 12px; font: inherit; background: var(--surface); color: var(--ink); outline: none; }
  .filters select { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font: inherit; background: var(--surface); color: var(--ink); }
  .lchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .lchip { border: 1px solid var(--line-2); background: var(--card-solid); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--ink-2); }
  .lchip.on { border-color: var(--ink-2); color: var(--ink); background: var(--hover); font-weight: 600; }
  .lchip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; }
  .rec { border-top: 1px solid var(--line); padding: 12px 4px; }
  .rec:first-child { border-top: 0; }
  .rec .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .part { border-radius: 5px; padding: 2px 7px; font-size: 11px; font-weight: 600; letter-spacing: .3px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .part.test { border-color: var(--ref-b); color: var(--ref-i); } .part.synthetic { border-style: dashed; }
  .rec .msg { margin: 6px 0 4px; }
  .rec details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .rec details div { font-size: 12.5px; color: var(--ink-2); margin: 4px 0 0 12px; }
  .rec .open { margin-left: auto; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .g-cue { background: var(--cue); } .g-val { background: var(--val); } .g-ref { background: var(--ref); } .g-old { background: var(--old); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand" data-ih="brand">Conversation<br>Revision<br>Analyzer</div>
    <hr>
    <nav aria-label="Pages">
      <button class="on" data-view="analyze"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg><span data-i="nav_analyze">Analyze</span></button>
      <button data-view="examples"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg><span data-i="nav_examples">Examples</span></button>
      <button data-view="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg><span data-i="nav_data">Dataset</span></button>
      <button data-view="model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg><span data-i="nav_model">Model Info</span></button>
      <button data-view="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3zM21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z"/></svg><span data-i="nav_about">About</span></button>
    </nav>
    <div class="tagline" data-ih="tagline"></div><div class="side-art"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><div><b>DeBERTa-v3</b><small id="st-seeds"></small></div></div>
      <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg><div><b id="st-dev">—</b><small data-i="device"></small></div></div>
      <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b id="st-ms">—</b><small data-i="last_req"></small></div></div>
      <div class="pill lang" role="group" aria-label="Language"><button data-lang="en" type="button">EN</button><button data-lang="tr" type="button">TR</button></div>
      <button class="pill themebtn" id="theme" type="button">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <!-- ANALYZE -->
    <section class="view on" id="v-analyze">
      <div class="an" id="an">
        <div class="leftcol">
          <div class="card">
            <div class="head"><div class="num">01</div><div><h2 data-i="c1_t"></h2><p data-i="c1_s"></p></div>
              <div class="right"><button class="ghost" id="clear" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h16M14 4l6 6-9 9H5v-6z"/></svg><span data-i="clear"></span></button></div></div>
            <div id="turns"></div>
            <div class="ctxnote" id="ctxnote"></div>
            <button class="btn" id="addturn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span data-i="addturn"></span></button>
          </div>
          <div class="card">
            <div class="head"><div class="num">02</div><div><h2 data-i="c2_t"></h2><p data-i="c2_s"></p></div><span class="count" id="count">0 / 300</span></div>
            <textarea id="utt" maxlength="300" spellcheck="false" data-iph="utt_ph"></textarea>
            <div class="err" id="err" role="alert"></div>
            <div class="ctxnote" id="staticnote" data-ih="static_note" hidden></div>
            <div class="toggle">
              <button class="switch" id="hist" role="switch" aria-checked="false"></button>
              <div><b data-i="hist_b"></b> <span style="color:var(--muted);font-size:12px" data-i="hist_tag"></span><small data-ih="hist_small"></small></div>
            </div>
            <button class="go" id="go" type="button" style="margin-top:18px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg><span id="golabel"></span><kbd>Enter ↵</kbd></button>
            <div class="sub" style="margin-top:22px"><h3 data-i="try"></h3><button class="ghost" style="margin-left:auto" data-goto="examples" type="button" data-i="seeall"></button></div>
            <div class="ex-row" id="ex-row"></div>
          </div>
        </div>

        <div class="card" id="work">
          <div class="head"><div class="num" id="worknum">03</div><div><h2 id="worktitle"></h2><p id="worksub"></p></div>
            <div class="right"><div class="seg" id="seg-a" role="tablist"><button class="on" data-stage="visual" role="tab" data-i="tab_visual"></button><button data-stage="table" role="tab" data-i="tab_table"></button><button data-stage="spans" role="tab" data-i="tab_spans"></button></div></div></div>
          <div id="st-visual">
            <div class="stage" id="stage">
              <svg class="links" id="links" aria-hidden="true"></svg>
              <div class="tags-row" id="tagsrow"></div>
              <div class="chips-row" id="chips"></div>
              <div class="cards-row" id="rcards"></div>
              <div class="guide" id="ph" data-ih="guide"></div>
            </div>
            <div class="verdict" id="verdict"></div>
            <div class="legend"><span style="--c:var(--cue-c)" data-i="lg_cue"></span><span style="--c:var(--val-c)" data-i="lg_val"></span><span style="--c:var(--ref-c)" data-i="lg_ref"></span><span style="--c:var(--old-c)" data-i="lg_old"></span><span style="--c:var(--none-c)" data-i="lg_none"></span></div>
          </div>
          <div id="st-table" hidden>
            <table><thead><tr><th>#</th><th data-i="th_word"></th><th data-i="th_tokens"></th><th data-i="th_role"></th><th style="width:26%" data-i="th_conf"></th><th>Seed 1</th><th>Seed 2</th><th>Seed 3</th></tr></thead><tbody id="tbody"></tbody></table>
          </div>
          <div id="st-spans" hidden>
            <div class="spans-grid">
              <div id="spanlist"></div>
              <div class="card detail" style="padding:20px 22px"><div class="sub"><h3 data-i="span_details"></h3></div><div id="detail"></div></div>
            </div>
            <div class="card" style="margin-top:16px;padding:18px 22px"><div class="sub"><h3 style="font-size:16px" data-i="all_spans"></h3></div><div class="strip" id="strip"></div></div>
          </div>
        </div>
      </div>
    </section>

    <!-- EXAMPLES -->
    <section class="view" id="v-examples">
      <div class="stats">
        <div class="stat"><small data-i="ex_n"></small><b id="ex-n">0</b></div>
        <div class="stat"><small data-i="ex_d"></small><b id="ex-d">0</b></div>
        <div class="stat"><small data-i="ex_r"></small><b id="ex-r">—</b><div class="dots" id="ex-dots"></div></div>
        <button class="runall" id="runall" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg><span id="runlabel"></span></button>
      </div>
      <div class="card">
        <div class="head"><div class="num">✦</div><div><h2 data-i="ex_t"></h2><p data-i="ex_s"></p></div></div>
        <div class="extable-wrap"><table class="extable"><thead><tr><th>#</th><th data-i="exh_scn"></th><th data-i="exh_dom"></th><th data-i="exh_turn"></th><th style="width:30%" data-i="exh_msg"></th><th data-i="exh_roles"></th><th data-i="exh_conf"></th><th></th></tr></thead><tbody id="ex-body"></tbody></table></div>
      </div>
    </section>

    <!-- DATASET -->
    <section class="view" id="v-data">
      <div class="stats">
        <div class="stat"><small data-i="ds_turns"></small><b id="ds-turns">—</b></div>
        <div class="stat"><small data-i="ds_labels"></small><b id="ds-labels">—</b></div>
        <div class="stat"><small data-i="ds_spans"></small><b id="ds-spans">—</b></div>
        <div class="stat"><small data-i="ds_doms"></small><b id="ds-doms">—</b></div>
      </div>
      <div class="grid2" style="margin-bottom:18px">
        <div class="card"><div class="sub"><h3 style="font-size:16px" data-i="ds_bylabel"></h3></div><div class="dchart" id="ds-labelchart"></div>
          <div class="keys"><span style="--c:var(--ink-2)" data-i="ds_train"></span><span style="--c:var(--ref-c)" data-i="ds_test"></span><span style="--c:var(--line-2)" data-i="ds_syn"></span></div></div>
        <div class="card"><div class="sub"><h3 style="font-size:16px" data-i="ds_bydom"></h3><small class="count" data-i="ds_human"></small></div><div class="dchart" id="ds-domchart"></div></div>
      </div>
      <div class="card">
        <div class="head"><div class="num">◎</div><div><h2 data-i="ds_t"></h2><p data-i="ds_s"></p></div></div>
        <div class="filters">
          <input type="search" id="ds-q" data-iph="ds_search" aria-label="Search">
          <div class="seg" id="ds-part"><button class="on" data-part="human" data-i="ds_p_human"></button><button data-part="train" data-i="ds_p_train"></button><button data-part="test" data-i="ds_p_test"></button><button data-part="synthetic" data-i="ds_p_syn"></button></div>
          <select id="ds-dom" aria-label="Domain"></select>
        </div>
        <div class="lchips" id="ds-lchips"></div>
        <div id="ds-list"></div>
        <div class="pager"><span id="ds-count"></span><div style="display:flex;gap:8px"><button class="open" id="ds-prev" type="button">←</button><span id="ds-page"></span><button class="open" id="ds-next" type="button">→</button></div></div>
      </div>
    </section>

    <!-- MODEL INFO -->
    <section class="view" id="v-model">
      <div class="card" style="margin-bottom:18px"><div class="head" style="margin:0"><div><h2 data-i="m_t"></h2><p data-i="m_s"></p></div>
        <div class="right"><div class="seg" id="seg-m"><button class="on" data-mtab="overview" data-i="m_over"></button><button data-mtab="bench" data-i="m_bench"></button></div></div></div></div>
      <div id="m-overview">
        <div class="grid2">
          <div class="card">
            <div style="display:flex;gap:14px;align-items:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
              <div><small style="color:var(--muted)">Model</small><div style="font-family:var(--serif);font-size:21px;font-weight:600" id="mi-model">microsoft/deberta-v3-base</div><small id="mi-seeds" style="color:var(--muted)"></small></div></div>
            <div class="kv"><div><small data-i="m_inf"></small><b id="mi-ms">—</b><br><small data-i="last_req"></small></div><div><small data-i="m_dev"></small><b id="mi-dev">—</b></div><div><small data-i="m_hist"></small><b id="mi-hist">—</b></div></div>
            <div class="sub" style="margin-top:24px"><h3 style="font-size:16px" data-i="m_seeds"></h3></div>
            <div id="mi-seedbars"></div>
          </div>
          <div class="card">
            <div class="sub"><h3 style="font-size:16px" data-i="m_role"></h3><small class="count" data-i="m_role_s"></small></div>
            <div class="chart" id="rolechart"></div><div class="chart-labels" id="rolelabels"></div>
          </div>
        </div>
        <div class="card" style="margin-top:18px">
          <div class="sub"><h3 style="font-size:16px" data-i="m_histo"></h3><small class="count" data-i="m_histo_s"></small></div>
          <div class="hist" id="confhist"></div><div class="axis"><span>0.0</span><span>0.2</span><span>0.4</span><span>0.6</span><span>0.8</span><span>1.0</span></div>
        </div>
      </div>
      <div id="m-bench" hidden>
        <div class="card">
          <div class="sub"><h3 data-i="b_t"></h3></div>
          <table class="bench"><thead><tr><th data-i="b_sys"></th><th>VALUE F1</th><th>CUE F1</th><th>S</th></tr></thead><tbody id="benchbody"></tbody></table>
          <p style="color:var(--muted);font-size:12.5px;margin-top:12px" data-ih="b_note"></p>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="view" id="v-about"><div class="card about" data-ih="about"></div></section>
  </main>
</div>
<canvas id="tiles" hidden></canvas>

<script>
/* ---------- text in both languages ---------- */
const I18N = {
  en: {
    brand: "Conversation<br>Revision<br>Analyzer", nav_analyze: "Analyze", nav_examples: "Examples", nav_model: "Model Info", nav_about: "About",
    tagline: "Understanding <b>user revisions</b> in natural conversations.", seeds_n: "{n} seeds (ensemble)", device: "device", last_req: "last request",
    loading: "loading…", unreach: "server not reachable", to_night: "Switch to night mode", to_day: "Switch to day mode",
    c1_t: "Conversation context", c1_s: "What was said before (optional).", clear: "Clear", addturn: "Add turn",
    ctx_off: "<b>Not read by the model right now.</b> The selected model labels the new message on its own. Turn on <i>Use history</i> to let it read these turns.",
    ctx_on: "<b>The model reads these turns</b> (their last 60 words) together with the new message.",
    ph_user: "e.g. Book a table for Friday at 6.", ph_system: "e.g. Booked: Friday, 6 pm, Dolce.", switch_spk: "Click to switch speaker", remove: "Remove turn",
    c2_t: "New user message", c2_s: "The sentence the model labels, word by word.", utt_ph: "e.g. Actually, make it 7 pm at the same place.",
    hist_b: "Use history", hist_tag: "(context-aware model)", hist_small: "Off: selected model (test S 0.768) &nbsp;|&nbsp; On: reads the last 60 words of history (test S 0.813)",
    go: "Analyze message", going: "Analyzing…", try: "Try an example", seeall: "See all →",
    tab_visual: "Visual", tab_table: "Token table", tab_spans: "Spans",
    st_visual: ["Model understanding", "Each word is assigned a role by the model, using the trained token heads."],
    st_table: ["Tokenization & predictions", "Each word, its model tokens, the predicted role and the confidence of every seed."],
    st_spans: ["Detected spans", "Contiguous words with the same role, and how sure each seed is."],
    guide: `<h3>How to use</h3><ol>

  $("rolechart").innerHTML = stats.map((p, i) => `<div class="col"><b>${p == null ? "—" : pct(p)}</b><i style="background:${fill[i]}" data-h="${p == null ? 0 : p * 100}"></i></div>`).join("");
  $("rolelabels").innerHTML = I18N[lang].chart.map((l) => `<span>${l}</span>`).join("");
  const n = last ? last.seeds : 3, seedMeans = [...Array(n)].map((_, k) => { const ps = words.map((w) => w.seed_p && w.seed_p[k]).filter((x) => x != null); return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null; });
  $("mi-seedbars").innerHTML = seedMeans.map((p, k) => `<div class="confcell" style="margin:10px 0"><span style="width:64px;flex:none;text-align:left;color:var(--ink-2);white-space:nowrap">Seed ${k + 1}</span><span>${p == null ? "–" : p.toFixed(2)}</span><div class="bar"><i style="background:var(--seed)" data-w="${(p || 0) * 100}"></i></div></div>`).join("");
  const bins = Array(20).fill(0); words.forEach((w) => { bins[Math.min(19, Math.floor(shown(w).p * 20))]++; });
  const mx = Math.max(1, ...bins);
  $("confhist").innerHTML = bins.map((b, i) => `<i class="${i >= 18 ? "hi" : ""}" data-h="${(b / mx) * 130}" title="${(i / 20).toFixed(2)}–${((i + 1) / 20).toFixed(2)}: ${b}"></i>`).join("");
  requestAnimationFrame(() => { document.querySelectorAll("#rolechart i").forEach((b) => b.style.height = (b.dataset.h * 1.3) + "px");
    document.querySelectorAll("#mi-seedbars i").forEach((b) => b.style.width = b.dataset.w + "%"); document.querySelectorAll("#confhist i").forEach((b) => b.style.height = b.dataset.h + "px"); });
}


/* ---------- dataset page ---------- */
const DS = { rows: null, part: "human", label: null, page: 0, per: 20 };
const LABELS = ["UPDATE_CUE", "NEW_VALUE", "REFERENCE", "OLD_VALUE", "KEPT_VALUE", "CANCEL_CUE", "KEEP_CUE", "RESTORE_CUE"];
async function loadData() {
  if (DS.rows) return renderData();
  try { DS.rows = (await (await api("data")).json()).records; } catch (e) { $("ds-list").innerHTML = `<p class="pending">${T("unreach")}</p>`; return; }
  renderData(true);
}
function renderData(fresh) {
  if (!DS.rows) return;
  const human = DS.rows.filter((r) => r.part !== "synthetic"), fmt = (n) => n.toLocaleString(lang === "tr" ? "tr-TR" : "en-US");
  $("ds-turns").textContent = fmt(human.length); $("ds-labels").textContent = fmt(human.reduce((a, r) => a + 2 * r.words, 0));
  $("ds-spans").textContent = fmt(human.reduce((a, r) => a + r.spans.length, 0)); $("ds-doms").textContent = new Set(human.map((r) => r.service)).size;
  const cnt = (part, lab) => DS.rows.filter((r) => r.part === part).reduce((a, r) => a + r.spans.filter((s) => s[2] === lab).length, 0);
  const lc = LABELS.map((l) => ({ l, tr: cnt("train", l), te: cnt("test", l), sy: cnt("synthetic", l) })).filter((x) => x.tr + x.te + x.sy);
  const mx = Math.max(...lc.map((x) => x.tr + x.te + x.sy));
  $("ds-labelchart").innerHTML = lc.map((x) => `<div class="drow"><span class="lbl">${x.l}</span><div class="stack">
      <i style="background:var(--ink-2)" data-w="${x.tr / mx * 100}"></i><i style="background:var(--ref-c)" data-w="${x.te / mx * 100}"></i><i style="background:var(--line-2)" data-w="${x.sy / mx * 100}"></i></div>
      <span class="n">${fmt(x.tr + x.te)}${x.sy ? ` <small style="color:var(--muted)">+${x.sy}</small>` : ""}</span></div>`).join("");
  const dom = {}; human.forEach((r) => { const d = r.service.split("_")[0]; dom[d] = (dom[d] || 0) + 1; });
  const ds = Object.entries(dom).sort((a, b) => b[1] - a[1]).slice(0, 10), dm = ds[0] ? ds[0][1] : 1;
  $("ds-domchart").innerHTML = ds.map(([d, n]) => `<div class="drow"><span class="lbl">${esc(d)}</span><div class="stack"><i style="background:var(--val-c)" data-w="${n / dm * 100}"></i></div><span class="n">${n}</span></div>`).join("");
  requestAnimationFrame(() => document.querySelectorAll("#v-data .stack i").forEach((i) => i.style.width = i.dataset.w + "%"));
  const sel = $("ds-dom"), cur = sel.value;
  sel.innerHTML = `<option value="">${T("ds_all_dom")}</option>` + [...new Set(DS.rows.map((r) => r.service.split("_")[0]))].sort().map((d) => `<option>${esc(d)}</option>`).join("");
  sel.value = cur;
  $("ds-lchips").innerHTML = [[null, T("ds_label_any"), "var(--none-c)"], ...LABELS.filter((l) => lc.some((x) => x.l === l)).map((l) => [l, l, COLOR[l]]), ["NONE", T("ds_nolabel"), "var(--line-2)"]]
    .map(([k, txt, c]) => `<button class="lchip ${DS.label === k ? "on" : ""}" data-l="${k ?? ""}" type="button"><i style="--c:${c}"></i>${esc(txt)}</button>`).join("");
  $("ds-lchips").querySelectorAll(".lchip").forEach((b) => b.onclick = () => { DS.label = b.dataset.l || null; DS.page = 0; renderData(); });
  if (fresh) DS.page = 0;
  renderList();
}
function renderList() {
  const q = $("ds-q").value.trim().toLowerCase(), dom = $("ds-dom").value;
  const rows = DS.rows.filter((r) => (DS.part === "human" ? r.part !== "synthetic" : r.part === DS.part)
    && (!dom || r.service.split("_")[0] === dom) && (!q || r.utt.toLowerCase().includes(q))
    && (!DS.label || (DS.label === "NONE" ? !r.spans.length : r.spans.some((s) => s[2] === DS.label))));
  const pages = Math.max(1, Math.ceil(rows.length / DS.per)); DS.page = Math.min(DS.page, pages - 1);
  const slice = rows.slice(DS.page * DS.per, DS.page * DS.per + DS.per);
  $("ds-list").innerHTML = slice.length ? slice.map((r) => `<div class="rec"><div class="top"><span class="part ${r.part}">${T(r.part === "synthetic" ? "ds_syn" : r.part === "test" ? "ds_test" : "ds_train")}</span>
      <span class="dom">${esc(r.service.split("_")[0])}</span><span>${esc(r.id)}</span><button class="open" type="button" data-id="${esc(r.id)}">${T("open")}</button></div>
      <div class="msg">${markup(r.utt, r.spans.map(([start, end, label]) => ({ start, end, label })))}</div>
      <div class="found-roles" style="max-width:none">${[...new Set(r.spans.map((s) => s[2]))].map((l) => `<span class="badge b-${l}">${l}</span>`).join("")}</div>
      ${r.history.length ? `<details><summary>${T("ds_ctx")} (${r.history.length})</summary>${r.history.map(([s, u]) => `<div><b>${esc(s)}:</b> ${esc(u)}</div>`).join("")}</details>` : ""}</div>`).join("")
    : `<p class="pending" style="padding:20px 4px">${T("ds_none")}</p>`;
  $("ds-list").querySelectorAll("[data-id]").forEach((b) => b.onclick = () => { const r = DS.rows.find((x) => x.id === b.dataset.id);
    load({ hist: r.history, utt: r.utt }); show("analyze"); setStage("visual"); analyze(); });
  $("ds-count").textContent = T("ds_count", { n: rows.length.toLocaleString(lang === "tr" ? "tr-TR" : "en-US") });
  $("ds-page").textContent = T("ds_page", { p: DS.page + 1, q: pages });
  $("ds-prev").disabled = DS.page === 0; $("ds-next").disabled = DS.page >= pages - 1;
}
$("ds-q").addEventListener("input", () => { DS.page = 0; renderList(); });
$("ds-dom").addEventListener("change", () => { DS.page = 0; renderList(); });
$("ds-prev").onclick = () => { DS.page--; renderList(); }; $("ds-next").onclick = () => { DS.page++; renderList(); };
document.querySelectorAll("#ds-part button").forEach((b) => b.onclick = () => {
  DS.part = b.dataset.part; DS.page = 0; document.querySelectorAll("#ds-part button").forEach((x) => x.classList.toggle("on", x === b)); renderList(); });

/* ---------- start ---------- */
if (params.has("demo")) load(EXAMPLES[0]); else { addTurn("USER"); addTurn("SYSTEM"); updCount(); }
$("staticnote").hidden = !STATIC_SITE;
applyLang();
</script>
